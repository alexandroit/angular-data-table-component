<example-shell
  exampleId="row-pinning" [title]="title" [summary]="summary" [dataSnippet]="dataSnippet" [events]="events" (clear)="clearEvents()">
  <div class="feature-demo">
    <div class="filter-toolbar">
      <label class="check-field inline-check">
        <input type="checkbox" [checked]="keepPinnedRows" (change)="setKeepPinnedRows($any($event.target).checked)" />
        <span>keepPinnedRows: show pinned rows on every page</span>
      </label>
    </div>
    <stackline-data-table
      title="Row pinning"
      [columns]="advancedColumns"
      [data]="orders"
      [pinnedTopRows]="topPinnedOrders"
      [pinnedBottomRows]="bottomPinnedOrders"
      [keepPinnedRows]="keepPinnedRows"
      [pagination]="true"
      [paginationPerPage]="5"
      (pageChange)="record('row pinning page', $event)">
    </stackline-data-table>
  </div>
</example-shell>
