name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.3, 24.15.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=low

  consumer:
    name: Installed Angular consumer matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run check
      - run: npm run test:consumer

  browser:
    name: Angular 22 documentation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run check
      - run: npm ci --prefix docs-src/angular-22
      - run: npm run build:docs
      - run: npm run test:browser
      - run: npm audit --prefix docs-src/angular-22 --audit-level=low

  artifact:
    name: Build release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run check
      - run: mkdir artifact
      - run: npm pack "$GITHUB_WORKSPACE/dist" --pack-destination "$GITHUB_WORKSPACE/artifact"
      - run: sha512sum artifact/*.tgz > artifact/SHA512SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stackline-angular-data-table-component-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
